<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audio Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: black;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player {
      background: white;
      border: 1px solid gray;
      padding: 24px;
      width: 360px;
      max-width: 95vw;
    }

    h1 {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 16px;
      color: black;
    }

    /* Upload */
    .upload-zone {
      border: 1px dashed gray;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
      position: relative;
      color: grey;
    }

    .upload-zone:hover { background:white; }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* Track name */
    .track-name {
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta {
      color: gray;
      font-size: 12px;
      margin-bottom: 16px;
    }

    /* Visualizer */
    canvas {
      display: block;
      width: 100%;
      height: 50px;
      background: white;
      border: 1px solid grey;
      margin-bottom: 16px;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      padding: 8px 14px;
      border: 1px solid gray;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-family: Arial, sans-serif;
    }

    button:hover { background: white; }

    button.active {
      background: black;
      color: white;
      border-color: black;
    }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .volume-row label { min-width: 52px; color: gray; }

    input[type="range"] {
      flex: 1;
      cursor: pointer;
      accent-color: black;
    }

    .vol-pct { min-width: 36px; text-align: right; color: gray; }

    /* Status */
    .status {
      font-size: 12px;
      color: gray;
      border-top: 1px solid white;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="player">
    <h1>Audio Player</h1>

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="audioFile" accept="audio/*" />
      Click or drop an audio file here
    </div>

    <div class="track-name" id="trackName">No track loaded</div>
    <div class="track-meta" id="trackMeta">&nbsp;</div>

    <canvas id="visualizer"></canvas>

    <div class="controls">
      <button id="btnPlay">▶ Play</button>
      <button id="btnLoop">↺ Loop</button>
    </div>

    <div class="volume-row">
      <label for="volumeSlider">Volume</label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" />
      <span class="vol-pct" id="volVal">100%</span>
    </div>

    <div class="status" id="status">Ready</div>
  </div>

  <audio id="audioEl"></audio>

  <script>
    const audio        = document.getElementById('audioEl');
    const fileInput    = document.getElementById('audioFile');
    const uploadZone   = document.getElementById('uploadZone');
    const btnPlay      = document.getElementById('btnPlay');
    const btnLoop      = document.getElementById('btnLoop');
    const volumeSlider = document.getElementById('volumeSlider');
    const volVal       = document.getElementById('volVal');
    const trackName    = document.getElementById('trackName');
    const trackMeta    = document.getElementById('trackMeta');
    const status       = document.getElementById('status');
    const canvas       = document.getElementById('visualizer');
    const ctx          = canvas.getContext('2d');

    // Web Audio API
    let audioCtx, analyser, source, dataArray, bufferLength;
    let vizRunning = false;

    function setupAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    // Load file
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) loadFile(e.target.files[0]);
    });

    uploadZone.addEventListener('dragover', e => e.preventDefault());
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('audio/')) loadFile(file);
    });

    function loadFile(file) {
      audio.src = URL.createObjectURL(file);
      audio.load();
      trackName.textContent = file.name.replace(/\.[^.]+$/, '');
      trackMeta.textContent = (file.type.split('/')[1] || 'audio').toUpperCase()
        + ' · ' + (file.size / 1024).toFixed(0) + ' KB';
      status.textContent = 'Track loaded — press Play';
    }

    // Play / Pause
    btnPlay.addEventListener('click', () => {
      if (!audio.src) return;
      setupAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audio.paused ? audio.play() : audio.pause();
    });

    audio.addEventListener('play', () => {
      btnPlay.textContent = '⏸ Pause';
      status.textContent = 'Playing';
      if (!vizRunning) drawVisualizer();
    });

    audio.addEventListener('pause', () => {
      btnPlay.textContent = '▶ Play';
      status.textContent = 'Paused';
    });

    audio.addEventListener('ended', () => {
      btnPlay.textContent = '▶ Play';
      status.textContent = 'Finished';
    });

    // Volume
    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value;
      volVal.textContent = Math.round(volumeSlider.value * 100) + '%';
    });

    // Loop
    btnLoop.addEventListener('click', () => {
      audio.loop = !audio.loop;
      btnLoop.classList.toggle('active', audio.loop);
      btnLoop.textContent = audio.loop ? '↺ Loop: On' : '↺ Loop';
      status.textContent = audio.loop ? 'Loop enabled' : 'Loop disabled';
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
      if (e.code === 'KeyL') btnLoop.click();
    });

    // Visualizer
    function drawVisualizer() {
      vizRunning = true;
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barW = canvas.width / bufferLength * 2.2;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const h = (dataArray[i] / 255) * canvas.height;
          ctx.fillStyle = audio.paused ? '#bbb' : '#555';
          ctx.fillRect(x, canvas.height - h, barW - 1, h);
          x += barW + 1;
        }
      }
      draw();
    }

    (function idle() {
      if (audio.src) return;
      requestAnimationFrame(idle);
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bw = canvas.width / 64 * 2.2;
      for (let i = 0; i < 64; i++) {
        const h = Math.sin(Date.now() / 1200 + i * 0.4) * 2 + 3;
        ctx.fillStyle = '#ccc';
        ctx.fillRect(i * (bw + 1), canvas.height - h, bw - 1, h);
      }
    })();
  </script>
</body>
</html>
